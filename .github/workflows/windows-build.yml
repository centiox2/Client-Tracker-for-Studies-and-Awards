name: S&A Hub – Windows build

on:
  push:
  workflow_dispatch:

# Online database (Supabase). The publishable key is designed to ship inside
# the app; keep this repository PRIVATE because the key allows reading the data.
# Repository secrets with the same names, if set, take priority.
env:
  SUPABASE_URL_DEFAULT: https://dpmluuckgstycdctqwym.supabase.co
  SUPABASE_KEY_DEFAULT: sb_publishable_qsw0KVpDbNr616WaSmG70w_QplfFMPs

# Publishing the installer to a GitHub Release needs write access.
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: a new Flutter release can need newer Android/Gradle
          # tools and break the build overnight. Upgrade on purpose.
          flutter-version: 3.47.9
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Check Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || env.SUPABASE_URL_DEFAULT }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || env.SUPABASE_KEY_DEFAULT }}
        run: |
          if (-not $env:SUPABASE_URL -or -not $env:SUPABASE_KEY) {
            Write-Error "SUPABASE_URL / SUPABASE_KEY repository secrets are missing - the app would build without online sync. Add them under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          }
          if ($env:SUPABASE_URL.Trim() -notmatch '^https://[a-z0-9]+\.supabase\.co$') {
            Write-Error "SUPABASE_URL should look like https://<ref>.supabase.co (no /rest/v1/, no trailing slash)."
            exit 1
          }

      - name: Build Windows release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || env.SUPABASE_URL_DEFAULT }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || env.SUPABASE_KEY_DEFAULT }}
        run: flutter build windows --release --dart-define=SUPABASE_URL="$env:SUPABASE_URL" --dart-define=SUPABASE_KEY="$env:SUPABASE_KEY"

      # Code signing (Authenticode), when the certificate is in the
      # repository secrets: WINDOWS_CERT_PFX_BASE64 (the .pfx file, base64)
      # and WINDOWS_CERT_PASSWORD. The app itself is signed here; the
      # installer and uninstaller while the installer is built. Without
      # the secrets the build carries on unsigned, with a warning.
      - name: Sign the app
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64 -or -not $env:WINDOWS_CERT_PASSWORD) {
            Write-Output "::warning::No Windows code-signing certificate in the secrets (WINDOWS_CERT_PFX_BASE64, WINDOWS_CERT_PASSWORD): the app and installer are not signed."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          if (-not $signtool) { Write-Error 'signtool.exe not found'; exit 1 }
          & $signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d "S&A Hub" build\windows\x64\runner\Release\client_tracker.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SIGNTOOL=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # A proper installer: per-user, Start menu + desktop shortcuts, an
      # uninstaller, and in-place upgrades (Inno Setup).
      - name: Build installer
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          if ($env:SIGNTOOL) {
            # Inno Setup signs the installer and uninstaller with this
            # ($f: the file, $q: a quote).
            $cmd = "`$q$env:SIGNTOOL`$q sign /f `$q$env:SIGN_PFX`$q /p `$q$env:WINDOWS_CERT_PASSWORD`$q /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d `$qS&A Hub`$q `$f"
            & $iscc "/DAppVersion=$version" /DSign "/Ssahub=$cmd" installer\client_tracker.iss
          } else {
            & $iscc "/DAppVersion=$version" installer\client_tracker.iss
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:SIGNTOOL) {
            & $env:SIGNTOOL verify /pa /v installer\Output\SAHubSetup.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Remove-Item $env:SIGN_PFX -Force
          }

      # Only the installer is kept, and on a GitHub Release rather than as a
      # build artifact: artifacts count against the Actions storage quota
      # (which ran out), releases don't. Pushes to main (and manual runs)
      # replace the "installer-latest" release; other branches only check
      # that the installer builds.
      - name: Publish installer
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $short = "$env:GITHUB_SHA".Substring(0, 7)
          # The first time there's no earlier release to remove: carry on.
          $PSNativeCommandUseErrorActionPreference = $false
          gh release delete installer-latest --cleanup-tag --yes 2>&1 | Out-Null
          gh release create installer-latest installer/Output/SAHubSetup.exe `
            --target "$env:GITHUB_SHA" `
            --title "S&A Hub for Windows $version ($short)" `
            --notes "Windows installer built from $env:GITHUB_REF_NAME at $short. Download SAHubSetup.exe and run it; it upgrades an existing install in place." `
            --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
