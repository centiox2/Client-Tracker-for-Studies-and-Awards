name: Client Tracker – Windows build

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Check Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if (-not $env:SUPABASE_URL -or -not $env:SUPABASE_KEY) {
            Write-Error "SUPABASE_URL / SUPABASE_KEY repository secrets are missing - the app would build without online sync. Add them under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          }
          if ($env:SUPABASE_URL.Trim() -notmatch '^https://[a-z0-9]+\.supabase\.co$') {
            Write-Error "SUPABASE_URL should look like https://<ref>.supabase.co (no /rest/v1/, no trailing slash)."
            exit 1
          }

      - name: Build Windows release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: flutter build windows --release --dart-define=SUPABASE_URL="$env:SUPABASE_URL" --dart-define=SUPABASE_KEY="$env:SUPABASE_KEY"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: client_tracker-windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
