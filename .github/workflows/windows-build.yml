name: S&A Hub – Windows build

# Only main makes a release. (It used to run on every branch too, which
# built each change twice and used up the free monthly build minutes.)
on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push replaces a build still running for the same branch, so
# minutes aren't spent on a version that's already out of date.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Online database (Supabase). The publishable key is designed to ship inside
# the app: it reads nothing by itself (every table is closed to it; data only
# comes through signed-in functions). Repository secrets with the same
# names, if set, take priority.
env:
  SUPABASE_URL_DEFAULT: https://dpmluuckgstycdctqwym.supabase.co
  SUPABASE_KEY_DEFAULT: sb_publishable_qsw0KVpDbNr616WaSmG70w_QplfFMPs

# Read-only by default; only the build job (which publishes the release)
# gets write access.
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # Actions are pinned to a commit (the tag in the comment), so a moved
      # tag can't change what runs with the signing secrets.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          # Pinned: a new Flutter release can need newer Android/Gradle
          # tools and break the build overnight. Upgrade on purpose.
          flutter-version: 3.47.9
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Check Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || env.SUPABASE_URL_DEFAULT }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || env.SUPABASE_KEY_DEFAULT }}
        run: |
          if (-not $env:SUPABASE_URL -or -not $env:SUPABASE_KEY) {
            Write-Error "SUPABASE_URL / SUPABASE_KEY repository secrets are missing - the app would build without online sync. Add them under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          }
          if ($env:SUPABASE_URL.Trim() -notmatch '^https://[a-z0-9]+\.supabase\.co$') {
            Write-Error "SUPABASE_URL should look like https://<ref>.supabase.co (no /rest/v1/, no trailing slash)."
            exit 1
          }

      - name: Build Windows release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || env.SUPABASE_URL_DEFAULT }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || env.SUPABASE_KEY_DEFAULT }}
        run: flutter build windows --release --dart-define=SUPABASE_URL="$env:SUPABASE_URL" --dart-define=SUPABASE_KEY="$env:SUPABASE_KEY"

      # Code signing (Authenticode), when the certificate is in the
      # repository secrets: WINDOWS_CERT_PFX_BASE64 (the .pfx file, base64)
      # and WINDOWS_CERT_PASSWORD. The app itself is signed here; the
      # installer and uninstaller while the installer is built. Without
      # the secrets the build carries on unsigned, with a warning.
      - name: Sign the app
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64 -or -not $env:WINDOWS_CERT_PASSWORD) {
            Write-Output "::warning::No Windows code-signing certificate in the secrets (WINDOWS_CERT_PFX_BASE64, WINDOWS_CERT_PASSWORD): the app and installer are not signed."
            exit 0
          }
          # The certificate goes into this runner's user store and signtool
          # picks it by thumbprint, so the password never appears on a
          # command line; the .pfx file is deleted straight away.
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            $pw = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
          $thumb = $cert.Thumbprint
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          if (-not $signtool) { Write-Error 'signtool.exe not found'; exit 1 }
          & $signtool sign /sha1 $thumb /s My /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d "S&A Hub" build\windows\x64\runner\Release\client_tracker.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SIGNTOOL=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGN_THUMB=$thumb" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # A proper installer: per-user, Start menu + desktop shortcuts, an
      # uninstaller, and in-place upgrades (Inno Setup).
      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          if ($env:SIGNTOOL) {
            # Inno Setup signs the installer and uninstaller with this
            # ($f: the file, $q: a quote).
            $cmd = "`$q$env:SIGNTOOL`$q sign /sha1 $env:SIGN_THUMB /s My /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d `$qS&A Hub`$q `$f"
            & $iscc "/DAppVersion=$version" /DSign "/Ssahub=$cmd" installer\client_tracker.iss
          } else {
            & $iscc "/DAppVersion=$version" installer\client_tracker.iss
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:SIGNTOOL) {
            & $env:SIGNTOOL verify /pa /v installer\Output\SAHubSetup.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Whatever happened above, the certificate leaves the runner.
      - name: Remove signing certificate
        if: always()
        run: |
          if ($env:SIGN_THUMB) {
            Remove-Item "Cert:\CurrentUser\My\$env:SIGN_THUMB" -Force -ErrorAction SilentlyContinue
          }
          Remove-Item (Join-Path $env:RUNNER_TEMP 'codesign.pfx') -Force -ErrorAction SilentlyContinue

      # Only the installer is kept, and on a GitHub Release rather than as a
      # build artifact: artifacts count against the Actions storage quota
      # (which ran out), releases don't. Only main (pushed, or run by hand)
      # replaces the "installer-latest" release; manual branch builds get
      # separate prereleases below.
      - name: Publish installer
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $short = "$env:GITHUB_SHA".Substring(0, 7)
          # The first time there's no earlier release to remove: carry on.
          $PSNativeCommandUseErrorActionPreference = $false
          gh release delete installer-latest --cleanup-tag --yes 2>&1 | Out-Null
          gh release create installer-latest installer/Output/SAHubSetup.exe `
            --target "$env:GITHUB_SHA" `
            --title "S&A Hub for Windows $version ($short)" `
            --notes "Windows installer built from $env:GITHUB_REF_NAME at $short. Download SAHubSetup.exe and run it; it upgrades an existing install in place." `
            --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Branch builds have their own downloadable preview and never replace
      # the production installer-latest release.
      - name: Publish branch preview installer
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $short = "$env:GITHUB_SHA".Substring(0, 7)
          $tag = "windows-preview-${{ github.run_id }}-${{ github.run_attempt }}"
          gh release create "$tag" installer/Output/SAHubSetup.exe `
            --target "$env:GITHUB_SHA" `
            --title "S&A Hub Windows preview $version ($short)" `
            --notes "Preview installer from $env:GITHUB_REF_NAME at $short. Built separately from the production release." `
            --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
